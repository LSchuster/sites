# CI + deploy for sites/dataplant → Cloudflare Pages.
#
# Deploy activates itself once two repository secrets exist (Settings →
# Secrets and variables → Actions): CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (shared across all site workflows). Until then the
# deploy job skips with a notice and the workflow stays green. Optional
# repository *variable* CLOUDFLARE_PROJECT_DATAPLANT overrides the Pages
# project name (default: dataplant → https://dataplant.pages.dev).
# Full setup checklist: sites/conflicts/docs/hosting-architecture.md
# § One-time Cloudflare setup.
#
# main push → production deployment · pull request → preview deployment.

name: dataplant

on:
  push:
    branches: [main]
    paths:
      - 'sites/dataplant/**'
      - '.github/workflows/dataplant.yml'
  pull_request:
    paths:
      - 'sites/dataplant/**'
      - '.github/workflows/dataplant.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataplant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/dataplant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/dataplant/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dataplant-dist
          path: sites/dataplant/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT_DATAPLANT || 'dataplant' }}
    steps:
      - name: Deploy skipped — secrets not configured yet
        if: env.HAS_CLOUDFLARE != 'true'
        run: >
          echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and
          CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment
          (see hosting-architecture.md § One-time Cloudflare setup)."

      - uses: actions/download-artifact@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          name: dataplant-dist
          path: dist

      - name: Ensure Pages project exists
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true # fails harmlessly when the project already exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: Publish
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
