# Deutsche Übersetzungen von Namen der Kriegsparteien (Side.members).
#
# Ein flaches Wörterbuch „englischer Name: deutscher Name“, angewendet von
# pipeline/6-compile-conflicts.ts auf jede members-Liste. Nur Namen aufnehmen,
# die sich vom Englischen unterscheiden — identische Namen fallen zur Laufzeit
# ohnehin auf das Original zurück. Für moderne Staaten, die hier fehlen,
# springt Intl.DisplayNames ein (pipeline/name-dictionary.ts); historische
# Namen brauchen einen Eintrag. Der Compile-Schritt meldet jeden Namen ohne
# Übersetzung.
#
# Die englischen Originale bleiben der Schlüssel überall im Code (Flaggen,
# Involvement-Matching); diese Übersetzungen erscheinen nur in der Oberfläche.

