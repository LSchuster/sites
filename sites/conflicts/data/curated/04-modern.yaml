- id: cambodian-genocide
  name: Cambodian Genocide
  startYear: 1975
  endYear: 1979
  centroid: [105.0, 12.5]
  extent: 3
  type: genocide
  region: Southeast Asia
  summary: >
    The Khmer Rouge emptied the cities within days of taking Phnom Penh, abolished
    money, markets and schools, and killed between a fifth and a quarter of Cambodia's
    population in under four years through execution, forced labour and starvation.
    The Cham Muslim and Vietnamese minorities were singled out for destruction. The
    toll is among the better established of any genocide: mass-grave surveys mapping
    some 20,000 burial sites and demographic reconstruction converge near 1.8 million.
    Ended by the Vietnamese invasion of January 1979; the tribunal that judged the
    surviving leadership delivered its first verdict thirty years later.
  total: { low: 1500000, best: 1800000, high: 2200000, confidence: estimated }
  sides:
