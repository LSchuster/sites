# Modern — 1914 to the present
#
# Note on `partOf`: several entries here are conventionally counted *inside* a
# larger conflict's total. The Holocaust and the Second Sino-Japanese War are both
# included in the 70–85 million usually quoted for the Second World War. They are
# listed separately because they matter separately, and marked `partOf: world-war-ii`
# so that anything summing deaths does not count those people twice.

- id: world-war-i
  name: World War I
  startYear: 1914
  endYear: 1918
  centroid: [8.0, 49.5]
  extent: 22
  type: interstate
  region: Europe and Middle East
  summary: >
    Four years of industrialised attrition that killed around 10 million soldiers
    and a comparable number of civilians. The Western Front barely moved between
    1914 and 1918 while consuming a generation. The 1918 influenza pandemic, spread
    by troop movements, killed more people worldwide than the fighting did and is
    excluded from the figures below.
  total: { low: 15000000, best: 20000000, high: 22000000, confidence: estimated }
  sides:
    - name: Allied Powers
      members: [Russia, France, United Kingdom, Italy, United States, Serbia, Romania, Japan]
      military: { low: 5000000, best: 5700000, high: 6500000, confidence: estimated }
      civilian: { low: 3000000, best: 3700000, high: 4500000, confidence: disputed }
    - name: Central Powers
      members: [Germany, Austria-Hungary, Ottoman Empire, Bulgaria]
      military: { low: 3800000, best: 4400000, high: 5000000, confidence: estimated }
      civilian: { low: 3000000, best: 3800000, high: 5000000, confidence: disputed }
  sources:
    - title: Wikipedia — World War I casualties
      url: https://en.wikipedia.org/wiki/World_War_I_casualties

