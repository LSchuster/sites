  startYear: 1946
  endYear: 1954
  centroid: [105.8, 21.0]
  extent: 5
  type: colonial
  region: Southeast Asia
  summary: >
    France's attempt to reassert colonial control over Indochina against the Viet
    Minh, fought from ambush and jungle garrison to the set-piece defeat at Dien Bien
