- id: iran-iraq-war
  name: Iran–Iraq War
  startYear: 1980
  endYear: 1988
  centroid: [47.0, 31.5]
  extent: 6
  type: interstate
  region: Middle East
  summary: >
    Eight years of war after Iraq's invasion of Iran, fought with trench lines,
    human-wave assaults and chemical weapons — the largest use of poison gas since
    1918, against soldiers at the front and Kurdish civilians at Halabja. Iran sent
    teenage volunteers across minefields; Iraq borrowed its way to bankruptcy, one
    cause of its seizure of Kuwait two years later. It ended almost exactly where it
    began, with no territorial change. The popular figure of a million dead does not
    survive contact with either country's postwar censuses: Iran's own martyrs'
    registry counts about 190,000, and scholarly datasets put the combined toll
    between roughly 400,000 and 700,000. The range here spans that dispute.
  # The traditional ~1M figure predates both countries' postwar demographic data;
  # Iran's official count and census-based scholarship (Kurzman) point far lower.
  total: { low: 300000, best: 500000, high: 1200000, confidence: disputed }
  sides:
    - name: Iran
      military: { low: 155000, best: 220000, high: 600000, confidence: disputed }
      civilian: { low: 11000, best: 16000, high: 40000, confidence: estimated }
    - name: Iraq
      military: { low: 105000, best: 250000, high: 500000, confidence: disputed }
      civilian: { low: 5000, best: 15000, high: 40000, confidence: disputed }
  sources:
