    up the surrounding mountains by hand. The Geneva Accords then partitioned Vietnam
    at the 17th parallel, the arrangement that led directly to the next war. The
    asymmetry of the record shapes the range: French Union losses are known nearly to
    the man, while Viet Minh and civilian deaths were estimated by others and dominate
    the uncertainty.
