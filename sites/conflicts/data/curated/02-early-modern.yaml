- id: french-wars-of-religion
  name: French Wars of Religion
  startYear: 1562
  endYear: 1598
  centroid: [2.3, 46.8]
  extent: 5
  type: religious
  region: France
  summary: >
    Eight civil wars in thirty-six years between Catholics and Huguenots, entangled
    with royal succession and noble rivalry. The St Bartholomew's Day Massacre of 1572
    killed thousands of Protestants in Paris and the provinces within weeks. The death
    toll — two to four million — is dominated not by battle but by the famine and
    disease of a country fought over for a generation, and rests on demographic
    reconstruction rather than any count. Ended by Henry IV's conversion to
    Catholicism and the Edict of Nantes of 1598, Europe's first durable experiment in
    the legal coexistence of two confessions.
  total: { low: 2000000, best: 3000000, high: 4000000, confidence: disputed }
