# Early modern — 1400 to 1800
#
# From here the record improves: parish registers, army muster rolls and tax
# records start to exist, and figures for European wars firm up considerably.
# They remain far weaker outside Europe, and weakest of all where the deaths were
# caused by the collapse of a food supply rather than by a battle.

