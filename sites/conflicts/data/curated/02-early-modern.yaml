- id: great-northern-war
  name: Great Northern War
  startYear: 1700
  endYear: 1721
  centroid: [28.0, 58.0]
  extent: 10
  type: interstate
  region: Northern Europe
  summary: >
    Russia, Denmark and Saxony–Poland attacked the Swedish Empire in coalition;
    twenty-one years later Sweden's Baltic dominion was gone and Russia had a navy, a
    Baltic coast and a new capital — St Petersburg, founded in 1703 on captured
    marshland. Charles XII's invasion of Russia was destroyed at Poltava in 1709, a
    defeat that prefigured 1812 and 1941 in its logic of distance, winter and scorched
    earth. As in every early-modern war, disease and cold killed far more soldiers
    than battle, and the plague that swept the Baltic in 1710 killed soldier and
    civilian alike — the civilian toll is not counted here.
  total: { low: 250000, best: 350000, high: 500000, confidence: estimated }
  sides:
