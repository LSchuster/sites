  startYear: 1775
  endYear: 1783
  centroid: [-77.0, 39.0]
  extent: 8
  type: rebellion
  region: North America
  summary: >
    The war of independence of the thirteen colonies, turned into a global conflict by
    French, Spanish and Dutch entry — the fighting reached Gibraltar, the Caribbean
    and India. Battle was a small part of the toll: more American soldiers died of
