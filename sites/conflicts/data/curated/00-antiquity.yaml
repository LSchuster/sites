# Antiquity — year 0 to 500 CE
#
# A warning that applies to this whole file: ancient casualty figures come to us
# almost entirely from literary sources with every reason to exaggerate. Josephus,
# Cassius Dio and the Chinese dynastic censuses are the backbone of the numbers
# below, and none of them is a body count in the modern sense. Ranges here are
# deliberately wide and most entries are marked `disputed`. The site renders that
# uncertainty rather than hiding it.
#
# Chinese census drops are the sharpest case. A registered-population fall of
# 40 million does not mean 40 million funerals — it also means tax registers
# collapsing, families fleeing registration, and territory leaving central control.
# Where a figure rests on a census drop, the summary says so.

- id: boudica-revolt
  name: Boudica's Revolt
  startYear: 60
  endYear: 61
  centroid: [-0.9, 52.2]
  extent: 3
  type: rebellion
  region: Britain
  summary: >
    A revolt of the Iceni and allied tribes against Roman rule in Britain that
    sacked Camulodunum, Londinium and Verulamium before being crushed at the
    Battle of Watling Street. Tacitus reports 70,000–80,000 Romans and allies
    killed in the sacked cities and some 80,000 Britons at the final battle —
    figures far larger than the plausible populations involved.
  total: { low: 70000, best: 150000, high: 230000, confidence: disputed }
  sides:
    - name: Roman Empire
      members: [Roman Britain]
      military: { low: 1000, best: 2000, high: 5000, confidence: disputed }
      civilian: { low: 30000, best: 70000, high: 80000, confidence: disputed }
    - name: Iceni and allied tribes
      members: [Iceni, Trinovantes]
      military: { low: 30000, best: 70000, high: 80000, confidence: disputed }
  sources:
    - title: Tacitus, Annals XIV
    - title: Wikipedia — Boudican revolt
      url: https://en.wikipedia.org/wiki/Boudican_revolt

- id: first-jewish-roman-war
  name: First Jewish–Roman War
  startYear: 66
  endYear: 73
  centroid: [35.2, 31.8]
  extent: 3
  type: rebellion
  region: Levant
  summary: >
    The Judean revolt against Rome, ending with the destruction of the Second
    Temple in 70 CE and the fall of Masada. Josephus — an eyewitness who defected
    to the Romans — claims 1.1 million died in the siege of Jerusalem alone.
    Modern historians regard that as an order of magnitude too high for the city's
    capacity, but the war was undeniably catastrophic for Judean society.
  total: { low: 100000, best: 350000, high: 1300000, confidence: disputed }
  sides:
    - name: Roman Empire
      military: { low: 10000, best: 20000, high: 30000, confidence: disputed }
    - name: Judean rebels
      members: [Zealots, Sicarii, Idumeans]
      military: { low: 50000, best: 100000, high: 200000, confidence: disputed }
      civilian: { low: 50000, best: 230000, high: 1100000, confidence: disputed }
  sources:
    - title: Josephus, The Jewish War
    - title: Wikipedia — First Jewish–Roman War
      url: https://en.wikipedia.org/wiki/First_Jewish%E2%80%93Roman_War

