- id: gothic-war-376
  name: Gothic War and the Battle of Adrianople
  startYear: 376
  endYear: 382
  centroid: [26.6, 41.8]
  extent: 5
  type: interstate
  region: Balkans
  summary: >
    Gothic groups fleeing the Huns were admitted across the Danube, then driven to
    revolt by Roman mistreatment. At Adrianople in 378 the eastern field army was
    destroyed and the emperor Valens killed — Ammianus called it the worst Roman
    defeat since Cannae. Rome's inability to expel the Goths afterwards marked a
    permanent shift in the empire's relationship with the peoples beyond its frontier.
  total: { low: 40000, best: 90000, high: 200000, confidence: disputed }
  sides:
    - name: Eastern Roman Empire
      military: { low: 15000, best: 25000, high: 40000, confidence: estimated }
    - name: Gothic confederation
      members: [Thervingi, Greuthungi, Alans]
      military: { low: 10000, best: 25000, high: 50000, confidence: disputed }
      civilian: { low: 10000, best: 40000, high: 110000, confidence: disputed }
  sources:
    - title: Ammianus Marcellinus, Res Gestae XXXI
    - title: Wikipedia — Battle of Adrianople
      url: https://en.wikipedia.org/wiki/Battle_of_Adrianople

