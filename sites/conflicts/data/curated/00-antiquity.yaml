      military: { low: 5000, best: 15000, high: 40000, confidence: disputed }
      civilian: { low: 20000, best: 100000, high: 460000, confidence: disputed }
    - name: Jewish diaspora rebels
      military: { low: 20000, best: 60000, high: 150000, confidence: disputed }
  sources:
    - title: Cassius Dio, Roman History LXVIII
    - title: Wikipedia — Kitos War
