- id: fall-western-rome
  name: Fall of the Western Roman Empire
  startYear: 406
  endYear: 476
  centroid: [10.0, 43.0]
  extent: 16
  type: interstate
  region: Western Europe
  summary: >
    The seventy years from the Rhine crossing of 406 to the deposition of Romulus
    Augustulus: Visigothic and Vandal settlement inside the empire, the sacks of
    Rome in 410 and 455, the loss of Africa's grain, and the empire's replacement in
    the west by successor kingdoms. Deaths from war are inseparable here from famine
    and the collapse of urban food supply.
