- id: three-kingdoms-war
  name: Wars of the Three Kingdoms (China)
  startYear: 220
  endYear: 280
  centroid: [112.0, 32.0]
  extent: 12
  type: civil
  region: East Asia
  summary: >
    Six decades of war between Wei, Shu and Wu following the collapse of the Han.
    The registered population of China fell from roughly 56 million in 156 CE to
    about 16 million by 280 CE. That 40-million gap is often quoted as a death
    toll, but much of it reflects the disintegration of the tax registers
    themselves — households fleeing registration, and territory passing out of
    central control. The true toll is enormous and genuinely unknown.
  total: { low: 10000000, best: 20000000, high: 40000000, confidence: disputed }
  sides:
    - name: Cao Wei
      military: { low: 500000, best: 1500000, high: 3000000, confidence: disputed }
    - name: Shu Han
      military: { low: 300000, best: 800000, high: 1500000, confidence: disputed }
    - name: Eastern Wu
      military: { low: 300000, best: 900000, high: 1800000, confidence: disputed }
  sources:
    - title: Records of the Three Kingdoms (Chen Shou)
    - title: Wikipedia — Three Kingdoms
      url: https://en.wikipedia.org/wiki/Three_Kingdoms

