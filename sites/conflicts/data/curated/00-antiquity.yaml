- id: kitos-war
  name: Kitos War
  startYear: 115
  endYear: 117
  centroid: [25.0, 32.0]
  extent: 12
  type: rebellion
  region: Mediterranean
  summary: >
    Diaspora Jewish revolts across Cyrenaica, Cyprus, Egypt and Mesopotamia while
    Trajan campaigned in Parthia. Cassius Dio's figures — 220,000 killed in
    Cyrenaica, 240,000 in Cyprus — would have meant near-total depopulation and are
    generally treated as literary rather than statistical.
  total: { low: 50000, best: 200000, high: 500000, confidence: disputed }
  sides:
