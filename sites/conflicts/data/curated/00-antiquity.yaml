- id: bar-kokhba-revolt
  name: Bar Kokhba Revolt
  startYear: 132
  endYear: 136
  centroid: [35.2, 31.6]
  extent: 2
  type: rebellion
  region: Levant
  summary: >
    The final Jewish revolt against Rome. Cassius Dio reports 580,000 Jewish dead
    and 985 villages destroyed, alongside Roman losses heavy enough that Hadrian
    reportedly omitted the customary "I and the army are well" from his report to
    the Senate. The defeat ended Jewish political presence in Judea for centuries.
  total: { low: 200000, best: 600000, high: 850000, confidence: disputed }
  sides:
    - name: Roman Empire
      military: { low: 20000, best: 50000, high: 100000, confidence: disputed }
    - name: Judean rebels
      members: [Bar Kokhba's forces]
      military: { low: 100000, best: 200000, high: 300000, confidence: disputed }
      civilian: { low: 80000, best: 350000, high: 500000, confidence: disputed }
  sources:
    - title: Cassius Dio, Roman History LXIX
    - title: Wikipedia — Bar Kokhba revolt
      url: https://en.wikipedia.org/wiki/Bar_Kokhba_revolt

- id: marcomannic-wars
  name: Marcomannic Wars
  startYear: 166
  endYear: 180
  centroid: [16.5, 48.2]
  extent: 6
  type: interstate
  region: Europe
  summary: >
    Germanic and Sarmatian incursions across the Danube that Marcus Aurelius spent
    the last fourteen years of his life fighting. The war ran concurrently with the
    Antonine Plague, and the two causes of death are impossible to separate in the
    sources — the plague alone may have killed 5–10 million across the empire.
  total: { low: 200000, best: 600000, high: 1000000, confidence: disputed }
  sides:
    - name: Roman Empire
      military: { low: 60000, best: 150000, high: 250000, confidence: disputed }
      civilian: { low: 50000, best: 200000, high: 400000, confidence: disputed }
    - name: Germanic and Sarmatian coalition
      members: [Marcomanni, Quadi, Iazyges, Vandals]
      military: { low: 80000, best: 200000, high: 350000, confidence: disputed }
  sources:
    - title: Cassius Dio, Roman History LXXI–LXXII
    - title: Wikipedia — Marcomannic Wars
      url: https://en.wikipedia.org/wiki/Marcomannic_Wars

- id: yellow-turban-rebellion
