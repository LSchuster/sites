- id: nian-rebellion
  name: Nian Rebellion
  startYear: 1851
  endYear: 1868
  centroid: [116.0, 33.5]
  extent: 5
  type: rebellion
  region: East Asia
  summary: >
    A cavalry-based peasant insurgency across the North China Plain, concurrent with
    the Taiping Rebellion and never fully separable from it — the Qing fought both at
    once, often with the same armies. The Yellow River's catastrophic change of course
    in 1855 flooded the region, displaced millions and swelled the rebel bands;
    banditry, reprisal and famine did most of the killing. The toll is the least
    certain of the era's Chinese conflicts, and the range here excludes the flood's
    direct victims. Suppressed in 1868 by the provincial armies of Zeng Guofan and Li
    Hongzhang — the same forces that had broken the Taiping.
  total: { low: 100000, best: 500000, high: 1000000, confidence: disputed }
  sides:
    - name: Qing dynasty
      members: [Qing dynasty, Xiang Army, Huai Army]
      military: { low: 50000, best: 150000, high: 300000, confidence: disputed }
    - name: Nian rebels
      military: { low: 50000, best: 150000, high: 300000, confidence: disputed }
      civilian: { low: 50000, best: 200000, high: 400000, confidence: disputed }
  sources:
    - title: Wikipedia — Nian Rebellion
      url: https://en.wikipedia.org/wiki/Nian_Rebellion

