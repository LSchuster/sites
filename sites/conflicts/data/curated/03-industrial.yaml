      members: [Russia, Austria, Prussia, United Kingdom, Spain (from 1808), Sweden, Portugal]
      military: { low: 1300000, best: 1900000, high: 2600000, confidence: estimated }
    - name: Civilian population
      civilian: { low: 1000000, best: 1300000, high: 2000000, confidence: disputed }
