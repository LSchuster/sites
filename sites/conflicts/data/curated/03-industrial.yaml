  startYear: 1885
  endYear: 1908
  centroid: [23.0, -2.0]
  extent: 10
  type: colonial
  region: Central Africa
  summary: >
    Leopold II of Belgium held the Congo as personal property and extracted rubber
    through forced labour enforced by hostage-taking, mutilation and massacre. The
    often-quoted figure of 10 million deaths originates with Adam Hochschild and
    represents an estimated halving of the population — a demographic estimate
    combining killings, famine, disease and collapsed birth rates, not a body count.
    Some historians consider it too high; others too low. There was never a census.
