# Industrial era — 1800 to 1914
#
# The century in which the deadliest war in human history to that point was fought
# not in Europe but in China. The Taiping Rebellion killed an order of magnitude
# more people than the American Civil War running at almost the same time, and is
# far less known in the West — a good illustration of why this atlas weights by
# deaths rather than by familiarity.

- id: napoleonic-wars
  name: Napoleonic Wars
  startYear: 1803
  endYear: 1815
  centroid: [12.0, 48.0]
  extent: 20
  type: interstate
  region: Europe
  summary: >
    A dozen years of war between Napoleonic France and shifting coalitions, fought
    from Portugal to Moscow and from Egypt to the Caribbean. The invasion of Russia
    in 1812 destroyed an army of around 600,000; fewer than a tenth returned. The
    wars introduced mass conscription and the levée en masse, and with them the
    modern scale of European warfare.
  total: { low: 3500000, best: 5000000, high: 7000000, confidence: estimated }
  sides:
