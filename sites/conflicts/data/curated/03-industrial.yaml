- id: latin-american-independence
  name: Spanish American Wars of Independence
  startYear: 1808
  endYear: 1833
  centroid: [-70.0, -10.0]
  extent: 25
  type: rebellion
  region: Latin America
  summary: >
    The wars that dismantled Spain's American empire, from Mexico to the Río de la
    Plata, opened by Napoleon's usurpation of the Spanish crown in 1808. Bolívar, San
    Martín, Hidalgo and Morelos fought royalist armies that were themselves largely
    American-born — as much a set of civil wars as a liberation. Venezuela and New
    Granada saw declarations of "war to the death"; Mexico's insurgency alone may
    account for a third or more of the total. The figures are demographic estimates:
    no army on either side kept reliable rolls, and civilian deaths from disease,
    requisition and reprisal were never counted at all.
  total: { low: 400000, best: 600000, high: 900000, confidence: disputed }
  sides:
