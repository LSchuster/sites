- id: franco-prussian-war
  name: Franco-Prussian War
  startYear: 1870
  endYear: 1871
  centroid: [5.5, 48.8]
  extent: 4
  type: interstate
  region: Western Europe
  summary: >
    Prussia's rapid defeat of France, sealed by the capture of Napoleon III at Sedan
    and the siege of Paris. The German Empire was proclaimed in the Hall of Mirrors at
    Versailles in January 1871, and the annexation of Alsace-Lorraine set the
    grievance that helped produce 1914. French losses are dominated by disease — in
    prison camps and in the improvised armies of the young Republic — and the smallpox
    epidemic the war spread across Europe killed more civilians than the fighting did,
    beyond the range counted here. The Paris Commune and its bloody suppression
    followed within weeks of the peace.
  total: { low: 180000, best: 250000, high: 300000, confidence: estimated }
  sides:
