- id: panthay-rebellion
  name: Panthay Rebellion
  startYear: 1856
  endYear: 1873
  centroid: [100.5, 25.0]
  extent: 4
  type: rebellion
  region: East Asia
  summary: >
    A Hui Muslim rebellion in Yunnan against Qing rule, sparked by officially
    tolerated massacres of Hui miners, which established a sultanate at Dali under Du
    Wenxiu before being crushed. The reconquest ended in extermination: Dali's fall in
    1872 was followed by a general massacre, and Du Wenxiu's surrender did not stop
    it. Provincial gazetteers suggest Yunnan's population fell by several million
    across the rebellion — how much of that was death and how much flight is
    unresolved, which is why the total here stays near the low end of what the
    demographic collapse would allow.
  total: { low: 890000, best: 1000000, high: 1100000, confidence: disputed }
  sides:
    - name: Qing dynasty
      military: { low: 100000, best: 200000, high: 300000, confidence: disputed }
    - name: Pingnan Guo (Panthay rebels)
      military: { low: 150000, best: 300000, high: 400000, confidence: disputed }
      civilian: { low: 400000, best: 500000, high: 600000, confidence: disputed }
  sources:
    - title: Wikipedia — Panthay Rebellion
      url: https://en.wikipedia.org/wiki/Panthay_Rebellion

