- id: saxon-wars
  name: Saxon Wars
  startYear: 772
  endYear: 804
  centroid: [9.5, 52.3]
  extent: 4
  type: religious
  region: Central Europe
  summary: >
    Charlemagne's thirty-two-year campaign to conquer and forcibly Christianise the
    Saxons — some eighteen campaigns over three decades, answered by repeated revolt
    under Widukind. The Massacre of Verden in 782, in which some 4,500 Saxon captives
    were reportedly beheaded in a single day, and the mass deportations that followed
    made baptism a condition of survival: Charlemagne's Saxon capitulary prescribed
    death for refusing it. No contemporary counted the dead. The range here is inferred
    from the war's length and the scale of the deportations, and should be read as an
    order of magnitude, not a count.
  total: { low: 50000, best: 150000, high: 300000, confidence: disputed }
  sides:
    - name: Frankish Empire
      military: { low: 15000, best: 40000, high: 80000, confidence: disputed }
    - name: Saxons
      members: [Westphalians, Eastphalians, Angrians, Nordalbingians]
      military: { low: 25000, best: 70000, high: 130000, confidence: disputed }
      civilian: { low: 10000, best: 40000, high: 90000, confidence: disputed }
  sources:
    - title: Einhard, Life of Charlemagne
    - title: Wikipedia — Saxon Wars
      url: https://en.wikipedia.org/wiki/Saxon_Wars

- id: an-lushan-rebellion
  name: An Lushan Rebellion
  startYear: 755
  endYear: 763
  centroid: [112.5, 34.7]
  extent: 9
  type: rebellion
  region: East Asia
  summary: >
    A revolt by the frontier general An Lushan against the Tang dynasty. The Tang
    census recorded 52.9 million people in 754 and 16.9 million in 764 — a fall of
    36 million in a decade. Taken at face value that would make this the deadliest
    event in human history before the 20th century, killing perhaps one person in
    six alive on Earth. Most modern demographers do not take it at face value: much
    of the gap reflects the collapse of the census apparatus itself as the state
    lost the ability to register households. The lower bound below assumes most of
    the drop was administrative; the upper bound assumes most of it was death.
  total: { low: 13000000, best: 20000000, high: 36000000, confidence: disputed }
  sides:
    - name: Tang dynasty
      members: [Tang dynasty, Uyghur Khaganate, Abbasid contingents]
      military: { low: 1000000, best: 2000000, high: 4000000, confidence: disputed }
      civilian: { low: 8000000, best: 13000000, high: 24000000, confidence: disputed }
    - name: Yan (An Lushan's forces)
      military: { low: 1000000, best: 2500000, high: 5000000, confidence: disputed }
  sources:
    - title: Wikipedia — An Lushan Rebellion
      url: https://en.wikipedia.org/wiki/An_Lushan_Rebellion
    - title: Wikipedia — List of wars by death toll
      url: https://en.wikipedia.org/wiki/List_of_wars_by_death_toll

