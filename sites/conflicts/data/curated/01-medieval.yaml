  summary: >
    Three Khitan Liao invasions of Korea. The first was ended by negotiation, the
    second sacked the capital Kaeseong in 1011, and the third was annihilated at
    Kuju in 1019 — the chronicle claims only a few thousand of 100,000 Liao
    soldiers returned across the Yalu. Goryeo kept its independence and its Song
    ties; the three states settled into a century of balance. The numbers are
    chronicle numbers: army sizes in the hundreds of thousands are claimed, none
