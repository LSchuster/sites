  startYear: 1037
  endYear: 1092
  centroid: [48.0, 35.0]
  extent: 15
  type: invasion
  region: Middle East
  summary: >
    The Seljuk Turks' half-century sweep from the Central Asian steppe: Khorasan
    taken from the Ghaznavids at Dandanaqan in 1040, Baghdad entered in 1055 with
    the caliph reduced to a figurehead, Armenia's Ani sacked in 1064, and the
    Byzantine field army broken at Manzikert in 1071 — the defeat that opened
    Anatolia to Turkish settlement and, a generation later, provoked the Crusades.
    The entry ends at Malik-Shah's death in 1092, when the empire fractured. As
    with every steppe conquest, the dead went uncounted; the range is inferred
    from the scale and duration of the campaigns.
