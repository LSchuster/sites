- id: song-liao-war
  name: Song–Liao War
  startYear: 979
  endYear: 1005
  centroid: [116.5, 39.5]
  extent: 5
  type: interstate
  region: East Asia
  summary: >
    The new Song dynasty's attempt to recover the Sixteen Prefectures around
    modern Beijing from the Khitan Liao — repulsed at the Gaoliang River in 979 and
    catastrophically in the three-pronged campaign of 986 — followed by two decades
    of border war and a full Liao invasion southward in 1004. The Treaty of
    Chanyuan of 1005 ended it with a fiction both sides could live with: peace
    between equals, paid for by annual Song tribute in silver and silk. It held for
    over a century. Chronicles record armies in the hundreds of thousands but no
    credible casualty totals.
  total: { low: 100000, best: 250000, high: 600000, confidence: disputed }
  sides:
    - name: Song dynasty
      military: { low: 60000, best: 140000, high: 330000, confidence: disputed }
