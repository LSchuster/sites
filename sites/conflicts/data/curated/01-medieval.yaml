# Medieval — 500 to 1400 CE
#
# Two entries here (An Lushan and the Mongol conquests) are among the deadliest
# events in human history by any measure, and both are the subject of serious
# scholarly disagreement about magnitude. Both are marked `disputed` with wide
# ranges. They are also the strongest argument for the population-share view:
# measured against the world population of their day, they dwarf the 20th century.

- id: gothic-war-535
  name: Gothic War (Justinian's Reconquest)
  startYear: 535
  endYear: 554
  centroid: [12.5, 42.5]
  extent: 6
  type: interstate
  region: Italy
  summary: >
    Justinian's campaign to retake Italy from the Ostrogoths. It succeeded, and in
    doing so destroyed what it recovered: two decades of siege warfare, famine and
    the arrival of the Plague of Justinian left Italy depopulated and Rome — which
    changed hands five times — reduced to a fraction of its ancient size.
  total: { low: 300000, best: 800000, high: 2000000, confidence: disputed }
  sides:
    - name: Eastern Roman Empire
      military: { low: 40000, best: 100000, high: 200000, confidence: disputed }
    - name: Ostrogothic Kingdom
      military: { low: 50000, best: 120000, high: 250000, confidence: disputed }
    - name: Italian civilians
      civilian: { low: 200000, best: 580000, high: 1550000, confidence: disputed }
  sources:
    - title: Procopius, History of the Wars
    - title: Wikipedia — Gothic War (535–554)
      url: https://en.wikipedia.org/wiki/Gothic_War_(535%E2%80%93554)

