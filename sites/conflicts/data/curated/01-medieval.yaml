# ── Additions filling the 6th- to 12th-century gaps ─────────────────────────
# The 10th century previously had zero entries and the 500s/800s/1000s/1100s one
# each. Every entry below follows the casualty-honesty policy: chronicler-only
# figures are `disputed`, ranges span the credible literature, and each summary
# says what its number rests on.

- id: byzantine-sasanian-572
  name: Byzantine–Sasanian War of 572–591
  startYear: 572
  endYear: 591
  centroid: [40.0, 37.5]
  extent: 6
  type: interstate
  region: Middle East
  summary: >
    Twenty years of war over Armenia and Mesopotamia, opened by Justin II's refusal
    of tribute and an Armenian revolt against Persia. It was a war of sieges and
    deportations — Dara fell in 573 and its population was marched east — ended not
    by victory but by a Persian civil war: the deposed Khosrow II fled to his
    enemies, was restored by Byzantine arms, and ceded most of Armenia in payment.
    No source counts the dead; the range here is inferred from army sizes, the
    length of the war and the sacked frontier cities, all of it disputed.
  total: { low: 80000, best: 200000, high: 500000, confidence: disputed }
  sides:
    - name: Byzantine Empire
      military: { low: 30000, best: 70000, high: 170000, confidence: disputed }
    - name: Sasanian Empire
      military: { low: 30000, best: 80000, high: 200000, confidence: disputed }
      civilian: { low: 20000, best: 50000, high: 130000, confidence: disputed }
  sources:
    - title: Greatrex & Lieu, The Roman Eastern Frontier and the Persian Wars, Part II
    - title: Wikipedia — Byzantine–Sasanian War of 572–591
      url: https://en.wikipedia.org/wiki/Byzantine%E2%80%93Sasanian_War_of_572%E2%80%93591

- id: zanj-rebellion
  name: Zanj Rebellion
  startYear: 869
  endYear: 883
  centroid: [47.6, 30.4]
  extent: 3
  type: rebellion
  region: Mesopotamia
  summary: >
    A fourteen-year revolt of East African slaves put to draining the salt marshes
    of southern Iraq, joined by peasants and deserters, which built a rebel state
    with its own capital and sacked Basra in 871. The Abbasids retook the marshes
    canal by canal. The toll is a textbook case of chronicle inflation: figures
    derived from al-Tabari and later compilers run from half a million to two and a
    half million, while modern historians, led by Popović, regard the low hundreds
    of thousands as the defensible order. The range spans both readings.
  total: { low: 100000, best: 300000, high: 2500000, confidence: disputed }
  sides:
    - name: Abbasid Caliphate
      military: { low: 20000, best: 50000, high: 150000, confidence: disputed }
    - name: Zanj rebels
      military: { low: 30000, best: 100000, high: 350000, confidence: disputed }
    - name: Civilian population
      civilian: { low: 50000, best: 150000, high: 2000000, confidence: disputed }
  sources:
    - title: Alexandre Popović, The Revolt of African Slaves in Iraq in the 3rd/9th Century
    - title: al-Tabari, History — The Revolt of the Zanj
    - title: Wikipedia — Zanj Rebellion
      url: https://en.wikipedia.org/wiki/Zanj_Rebellion

