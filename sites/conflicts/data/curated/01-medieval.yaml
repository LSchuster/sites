- id: genpei-war
  name: Genpei War
  startYear: 1180
  endYear: 1185
  centroid: [134.0, 34.5]
  extent: 3
  type: civil
  region: Japan
  summary: >
    The war between the Minamoto and Taira clans for control of Japan, ending with
    the Taira fleet destroyed at Dan-no-ura and the child emperor drowned with the
    imperial sword. Its consequence outlasted every battle: Minamoto no Yoritomo's
    new military government at Kamakura began seven centuries of shogunal rule.
    Battle deaths were counted in the thousands, but the Yōwa famine of 1181 —
    entangled with the war's requisitions and recorded by the chronicler Kamo no
    Chōmei as leaving the dead uncountable in the capital's streets — killed far
    more, and the range turns on how much of it is charged to the war.
  total: { low: 40000, best: 100000, high: 200000, confidence: disputed }
  sides:
    - name: Minamoto clan
      military: { low: 5000, best: 15000, high: 30000, confidence: disputed }
    - name: Taira clan
