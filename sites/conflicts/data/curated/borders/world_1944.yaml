# End of 1944. France, Belgium, Luxembourg, Greece, Albania and most of Yugoslavia
# are liberated (each spec stands alone against the 1938 base, so liberation is
# simply the absence of the occupation). Poland stays drawn as Reich territory —
# Warsaw fell only in January 1945 and the Vistula front cannot be drawn. The Baltic
# states are Soviet-held again; Denmark, Norway and the Netherlands remain occupied
# until May 1945, as does Japan's Pacific perimeter bar the Philippine landings.
base: 1938
merge:
  Germany: [Czechoslovakia, Poland]
occupy:
  - feature: Denmark
    subjectTo: Germany
  - feature: Norway
    subjectTo: Germany
  - feature: Netherlands
    subjectTo: Germany
  - feature: Estonia
    subjectTo: Soviet Union
  - feature: Latvia
    subjectTo: Soviet Union
  - feature: Lithuania
    subjectTo: Soviet Union
  - feature: Libya
    subjectTo: United Kingdom
  - feature: French Indo-China
    subjectTo: Empire of Japan
    name: French Indo-China (Japan)
  - feature: Philippines
    subjectTo: Empire of Japan
    name: Philippines (Japan)
  - feature: Malaysia
    subjectTo: Empire of Japan
    name: Malaya (Japan)
  - feature: Hong Kong
    subjectTo: Empire of Japan
    name: Hong Kong (Japan)
  - feature: Dutch East Indies
    subjectTo: Empire of Japan
    name: Dutch East Indies (Japan)
  - feature: Eritrea (Italy)
    subjectTo: United Kingdom
    name: Eritrea (United Kingdom)
  - feature: Italian Somaliland
    subjectTo: United Kingdom
    name: Somaliland (United Kingdom)
release:
  - Ethiopia (Italy)
